<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Tajawal"; font-weight: 400; src: url("assets/fonts/tajawal-arabic-400-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Tajawal"; font-weight: 700; src: url("assets/fonts/tajawal-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Tajawal"; font-weight: 800; src: url("assets/fonts/tajawal-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Tajawal"; font-weight: 400; src: url("assets/fonts/tajawal-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
      @font-face { font-family: "Tajawal"; font-weight: 700; src: url("assets/fonts/tajawal-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
      @font-face { font-family: "Tajawal"; font-weight: 800; src: url("assets/fonts/tajawal-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }

      :root {
        --ground: #06283a;
        --ground-2: #0b3b52;
        --ink: #ffffff;
        --muted: #9fc3d4;
        --accent: #1fb58a;
        --gold: #f2c14e;
        --card: rgba(255, 255, 255, 0.06);
        --card-line: rgba(255, 255, 255, 0.14);
        --font-display: "Tajawal", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative; width: 100%; height: 100%;
        font-family: var(--font-display); color: var(--ink);
        background: radial-gradient(1200px 800px at 70% 30%, var(--ground-2), var(--ground));
      }
      .scene {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }

      /* Scene 1 — title */
      #mark {
        width: 168px; height: 168px; border-radius: 40px;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 56px;
        box-shadow: 0 30px 80px rgba(31, 181, 138, 0.35);
      }
      #mark svg { width: 96px; height: 96px; }
      #title { font-size: 112px; font-weight: 800; line-height: 1.1; }
      #rule { width: 360px; height: 8px; border-radius: 4px; background: var(--gold); margin: 40px 0 36px; transform-origin: center; }
      #subtitle { font-size: 56px; font-weight: 700; color: var(--muted); }

      /* Scene 2 — features */
      #features-head { font-size: 72px; font-weight: 800; margin-bottom: 72px; }
      #features-head span { color: var(--accent); }
      #grid { display: grid; grid-template-columns: repeat(4, 340px); gap: 40px; }
      .card {
        height: 380px; border-radius: 32px;
        background: var(--card); border: 2px solid var(--card-line);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
      }
      .icon {
        width: 128px; height: 128px; border-radius: 32px;
        background: rgba(31, 181, 138, 0.16);
        display: flex; align-items: center; justify-content: center;
      }
      .icon svg { width: 68px; height: 68px; }
      .card h3 { font-size: 46px; font-weight: 800; }
      .card p { font-size: 30px; font-weight: 400; color: var(--muted); margin-top: -20px; }

      /* Scene 3 — closing */
      #close-line { font-size: 96px; font-weight: 800; text-align: center; line-height: 1.25; }
      #close-line span { color: var(--accent); }
      #close-tag {
        margin-top: 64px; padding: 20px 56px; border-radius: 999px;
        background: var(--gold); color: var(--ground);
        font-size: 48px; font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">

      <!-- Scene 1: title -->
      <section id="s1" class="scene clip" data-start="0" data-duration="4.2" data-track-index="0">
        <div id="mark">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg>
        </div>
        <h1 id="title">نظام إدارة الموظفين</h1>
        <div id="rule"></div>
        <h2 id="subtitle">منطقة الجهراء الصحية</h2>
      </section>

      <!-- Scene 2: features -->
      <section id="s2" class="scene clip" data-start="4.2" data-duration="6.8" data-track-index="0">
        <h2 id="features-head">كل اللي تحتاجه <span>بنظام واحد</span></h2>
        <div id="grid">
          <div class="card" id="c1">
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1fb58a" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
            <h3>الحضور</h3><p>بصمة وانصراف</p>
          </div>
          <div class="card" id="c2">
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1fb58a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
            <h3>الإجازات</h3><p>طلب واعتماد</p>
          </div>
          <div class="card" id="c3">
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1fb58a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H8a5 5 0 0 0 0 10h1"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h13a5 5 0 0 0 0-10h-1"/></svg></div>
            <h3>المناوبات</h3><p>جدولة ذكية</p>
          </div>
          <div class="card" id="c4">
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1fb58a" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
            <h3>التقارير</h3><p>لحظية ودقيقة</p>
          </div>
        </div>
      </section>

      <!-- Scene 3: closing -->
      <section id="s3" class="scene clip" data-start="11" data-duration="4" data-track-index="0">
        <h2 id="close-line">بيانات موظفيك<br /><span>في مكان واحد</span></h2>
        <div id="close-tag">قريباً</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1 — mark pops, title rises, gold rule draws, subtitle fades
      tl.fromTo("#mark", { scale: 0.7, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.7)" }, 0);
      tl.fromTo("#title", { y: 40, opacity: 0.35 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 1.3);
      tl.fromTo("#subtitle", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 1.6);
      tl.to(["#mark", "#title", "#rule", "#subtitle"], { opacity: 0, y: -40, duration: 0.5, ease: "power2.in", stagger: 0.05 }, 3.55);

      // Scene 2 — heading, then cards stagger in (right to left for RTL)
      tl.fromTo("#features-head", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 4.4);
      tl.fromTo(["#c1", "#c2", "#c3", "#c4"], { y: 80, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.4)", stagger: 0.35 }, 5.0);
      tl.fromTo(".icon", { scale: 0.6 }, { scale: 1, duration: 0.6, ease: "back.out(2)", stagger: 0.35 }, 5.2);
      // Spotlight each card in turn so the scene keeps moving
      ["#c1", "#c2", "#c3", "#c4"].forEach((c, i) => {
        const t = 7.0 + i * 0.8;
        tl.to(c, { backgroundColor: "rgba(31,181,138,0.22)", borderColor: "#1fb58a", y: -16, duration: 0.35, ease: "power2.out" }, t);
        tl.to(c, { backgroundColor: "rgba(255,255,255,0.06)", borderColor: "rgba(255,255,255,0.14)", y: 0, duration: 0.45, ease: "power2.inOut" }, t + 0.5);
      });
      tl.to(["#features-head", "#grid"], { opacity: 0, y: -40, duration: 0.5, ease: "power2.in", stagger: 0.05 }, 10.4);

      // Scene 3 — closing line and tag
      tl.fromTo("#close-line", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 11.2);
      tl.fromTo("#close-tag", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" }, 12.1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
