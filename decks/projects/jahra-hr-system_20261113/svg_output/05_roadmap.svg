    <circle cx="775" cy="300" r="22" fill="#FFFFFF" stroke="#1FB58A" stroke-width="4"/>
    <rect x="655" y="352" width="240" height="200" rx="18" fill="#FFFFFF" stroke="#D7E2E8" stroke-width="1.5"/>
    <text x="775" y="404" font-size="26" font-weight="bold" fill="#0F2533" text-anchor="middle">التصميم والتطوير</text>
    <text x="775" y="458" font-size="20" fill="#536B7A" text-anchor="middle">بناء النظام بتقنيات<tspan x="775" dy="32">ويب حديثة وآمنة</tspan></text>
