<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar" data-pptx-page-role="content" font-family="Segoe UI">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F8FA"/>
  <g id="header" data-pptx-bounds="80 44 1120 108" text-anchor="end">
