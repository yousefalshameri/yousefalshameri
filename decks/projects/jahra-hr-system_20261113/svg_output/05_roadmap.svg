    <text x="1045" y="404" font-size="26" font-weight="bold" fill="#0F2533" text-anchor="middle">تحليل المتطلبات</text>
    <text x="1045" y="458" font-size="20" fill="#536B7A" text-anchor="middle">جمع احتياجات الأقسام<tspan x="1045" dy="32">والموارد البشرية</tspan></text>
