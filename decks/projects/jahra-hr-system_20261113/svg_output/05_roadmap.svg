    <rect x="1136" y="144" width="64" height="6" rx="3" fill="#F2C14E"/>
  </g>
  <rect id="timeline-rail" data-pptx-role="decoration" x="150" y="297" width="980" height="6" rx="3" fill="#D7E2E8"/>
